name: Test

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - .editorconfig
      - .gitignore
      - .renovaterc.json
      - .trunk/**
      - LICENSE
      - README.md
      - biome.jsonc
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Install snap
        run: sudo snap install --dangerous --classic ${{ steps.snapcraft.outputs.snap }}

      - name: Check snap
        run: snap info --verbose tf-wrapper
